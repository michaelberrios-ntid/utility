[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-utility"
version = "0.1.0"
description = "A Python utility repository for reusable educational tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Michael Berrios", email = "michaelberrios-ntid@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
grade-calc = "utility.cli.grade_calculator:main"
rubric-export = "utility.cli.rubric_exporter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["utility*"]
